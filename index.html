<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LooPaint</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="min-h-screen flex flex-col justify-between p-2 sm:p-3 text-xs sm:text-sm" data-theme="dark">

  <!-- メインDAWコンテナ -->
  <div class="max-w-7xl w-full mx-auto space-y-2.5">

    <!-- 1. トップトランスポート & マスターコントロール -->
    <header class="themed-panel border rounded-lg p-2.5 shadow-sm">
      <div class="flex flex-wrap items-center justify-between gap-2.5">

        <!-- アプリロゴ & タイトル -->
        <div class="flex items-center space-x-2.5">
          <div class="w-2.5 h-8 rounded-sm bg-gradient-to-b from-cyan-400 to-blue-600"></div>
          <div>
            <div class="flex items-center space-x-2">
              <h1 class="font-bold text-sm sm:text-base tracking-wide">LooPaint</h1>
              <span
                class="text-[10px] font-mono px-1.5 py-0.5 rounded themed-surface border themed-border text-cyan-500 font-medium">ドローイングシーケンサー</span>
            </div>
            <p class="text-[11px] themed-text-muted hidden sm:block">絵を描くようにメロディを作曲</p>
          </div>
        </div>

        <!-- トランスポート操作（最初から再生・再生・停止・小節位置・ループ切替） -->
        <div class="flex items-center space-x-1.5 themed-surface p-1 rounded-md border themed-border">
          <!-- 最初に戻るボタン (シーク先頭) -->
          <button id="rewindBtn"
            class="px-2 py-1 rounded text-xs hover:bg-slate-500/20 themed-text-muted hover:text-white transition"
            title="曲の最初 (0小節目) に戻る">
            ⏮
          </button>

          <!-- 再生 / 一時停止 -->
          <button id="playBtn"
            class="flex items-center space-x-1 px-3 py-1.5 rounded font-semibold text-xs bg-slate-700/30 hover:bg-slate-700/60 border themed-border transition">
            <span id="playIcon" class="w-2 h-2 inline-block bg-emerald-500 rounded-full"></span>
            <span id="playText">再生</span>
          </button>

          <!-- 停止 -->
          <button id="stopBtn" class="px-2.5 py-1.5 rounded text-xs hover:bg-slate-500/20 themed-text-muted transition">
            ⏹ 停止
          </button>

          <!-- ループ再生 ON/OFF トグル -->
          <button id="loopToggleBtn"
            class="px-2 py-1 rounded text-[11px] font-bold border themed-border bg-cyan-500/20 text-cyan-400 transition"
            title="ループ再生 ON / OFF">
            ループ中
          </button>

          <!-- 小節・ステップ表示 -->
          <div class="px-2 py-0.5 themed-panel border themed-border rounded flex flex-col items-center min-w-[75px]">
            <span class="text-[8px] font-mono themed-text-muted uppercase">小節 / ステップ</span>
            <span id="stepReadout" class="font-mono font-bold text-xs text-amber-500 tracking-wider">1小節 / 01</span>
          </div>
        </div>

        <!-- 小節数設定 (可変小節) & テンポ -->
        <div class="flex flex-wrap items-center gap-2 themed-surface px-2.5 py-1 rounded-md border themed-border">
          <!-- 小節数設定 -->
          <div class="flex items-center space-x-1">
            <span class="text-[10px] themed-text-muted">小節数:</span>
            <select id="barCountSelect" title="曲の全体の小節数を変更">
              <option value="1">1 小節 (基本ループ)</option>
              <option value="2" selected>2 小節</option>
              <option value="4">4 小節 (フレーズ)</option>
              <option value="8">8 小節 (1コーラス)</option>
              <option value="16">16 小節 (ロング)</option>
              <option value="32">32 小節 (フルソング)</option>
            </select>
          </div>

          <!-- テンポ (BPM) -->
          <div class="flex flex-col space-y-0.5 w-18 sm:w-20">
            <div class="flex justify-between text-[10px] font-mono">
              <span class="themed-text-muted">BPM</span>
              <span id="bpmVal" class="text-orange-500 font-bold">120</span>
            </div>
            <input id="bpmSlider" type="range" min="40" max="220" value="120" class="flat-slider orange-thumb"
              title="曲のテンポ (BPM)" />
          </div>

          <!-- マスター音量 -->
          <div class="flex flex-col space-y-0.5 w-16 sm:w-18">
            <div class="flex justify-between text-[10px] font-mono">
              <span class="themed-text-muted">音量</span>
              <span id="masterVolVal" class="text-cyan-500 font-bold">85%</span>
            </div>
            <input id="masterVolSlider" type="range" min="0" max="100" value="85" class="flat-slider" title="全体音量" />
          </div>
        </div>

        <!-- カラーテーマ切替 & ビジュアライザー -->
        <div class="flex items-center space-x-2">
          <!-- カラーテーマセレクター -->
          <div class="flex items-center space-x-1">
            <span class="text-[10px] themed-text-muted">🎨 テーマ:</span>
            <select id="themeSelect" title="画面全体のカラーテーマを切り替え">
              <option value="dark" selected>ダーク</option>
              <option value="light">ライト</option>
              <option value="beepbox">レトロ</option>
              <option value="songmaker">パステル</option>
              <option value="cyberpunk">サイバー</option>
              <option value="sepia">セピア</option>
            </select>
          </div>

          <!-- ミニビジュアライザー -->
          <div
            class="relative themed-surface border themed-border rounded overflow-hidden w-24 h-8 cursor-pointer hidden md:block"
            id="visualizerContainer" title="クリックで表示切替">
            <canvas id="visualizerCanvas" class="w-full h-full block"></canvas>
          </div>

          <!-- プリセット & 描画クリア -->
          <select id="presetSelect" class="text-xs rounded px-2 py-1">
            <option value="empty">空のキャンバス</option>
            <option value="starry">プリセット 1</option>
            <option value="piano_melody">プリセット 2</option>
            <option value="slide_acid">プリセット 3</option>
          </select>

          <button id="clearBtn"
            class="px-2 py-1 rounded text-xs bg-rose-500/20 hover:bg-rose-500/40 text-rose-500 border border-rose-500/40 transition"
            title="描画メロディを全消去">
            全消去
          </button>
        </div>

      </div>
    </header>

    <!-- 2. 音響ドローイングキャンバス（8オクターブ・縦横ズーム・楽器パレット） -->
    <div class="themed-panel border rounded-lg p-2.5 shadow-sm space-y-2">

      <!-- ツールバー: 描画ツール・楽器音色パレット・ズームスライダー・解像度 -->
      <div class="flex flex-wrap items-center justify-between gap-2 pb-2 border-b themed-border">

        <!-- 描画ツール群 -->
        <div class="flex items-center space-x-1 themed-surface p-1 rounded border themed-border">
          <button id="toolPen"
            class="px-2.5 py-1 rounded text-xs font-semibold border border-cyan-500 transition flex items-center space-x-1"
            title="自由ペン (フリーハンドで自由に絵を描く)">
            <span>ペン</span>
          </button>
          <button id="toolSlide"
            class="px-2.5 py-1 rounded text-xs font-semibold border border-transparent themed-text-muted hover:text-white transition flex items-center space-x-1"
            title="スライド直線 (Beepbox風のアナログ音階スライド)">
            <span>直線</span>
          </button>
          <button id="toolEraser"
            class="px-2.5 py-1 rounded text-xs font-semibold border border-transparent themed-text-muted hover:text-white transition flex items-center space-x-1"
            title="消しゴム (なぞった線を消去)">
            <span>消しゴム</span>
          </button>
          <button id="undoBtn" class="px-2 py-1 rounded text-xs themed-text-muted hover:text-white transition"
            title="1つ前の描画を取り消す (Ctrl+Z)">
            <span>元に戻す</span>
          </button>
        </div>

        <!-- 楽器音色パレット (ピアノ・ギター・バイオリン・管楽器・シンセなど10種類) -->
        <div
          class="flex items-center space-x-1 themed-surface px-2 py-1 rounded border themed-border overflow-x-auto max-w-full">
          <span class="text-[10px] themed-text-muted mr-0.5 font-bold whitespace-nowrap">音色:</span>
          <!-- 楽器ボタン群 -->
          <button data-inst="piano" data-color="#3b82f6"
            class="inst-btn px-2 py-0.5 rounded text-[11px] font-semibold border-2 border-white transition flex items-center space-x-1"
            style="background-color: #3b82f6; color: white;" title="アコースティック・ピアノ (打弦倍音)">
            <span>ピアノ</span>
          </button>
          <button data-inst="guitar" data-color="#f59e0b"
            class="inst-btn px-2 py-0.5 rounded text-[11px] font-semibold border border-transparent transition flex items-center space-x-1"
            style="background-color: #f59e0b; color: white;" title="アコースティック・ギター (弦振動物理モデル)">
            <span>ギター</span>
          </button>
          <button data-inst="strings" data-color="#8b5cf6"
            class="inst-btn px-2 py-0.5 rounded text-[11px] font-semibold border border-transparent transition flex items-center space-x-1"
            style="background-color: #8b5cf6; color: white;" title="ストリングス / バイオリン (アンサンブル)">
            <span>弦楽器</span>
          </button>
          <button data-inst="brass" data-color="#eab308"
            class="inst-btn px-2 py-0.5 rounded text-[11px] font-semibold border border-transparent transition flex items-center space-x-1"
            style="background-color: #eab308; color: #1e293b;" title="ブラス / サックス (金管楽器)">
            <span>ブラス</span>
          </button>
          <button data-inst="marimba" data-color="#10b981"
            class="inst-btn px-2 py-0.5 rounded text-[11px] font-semibold border border-transparent transition flex items-center space-x-1"
            style="background-color: #10b981; color: white;" title="マリンバ / 木琴 (ウッドパーカッション)">
            <span>マリンバ</span>
          </button>
          <button data-inst="bass" data-color="#ef4444"
            class="inst-btn px-2 py-0.5 rounded text-[11px] font-semibold border border-transparent transition flex items-center space-x-1"
            style="background-color: #ef4444; color: white;" title="エレキベース (太い重低音スラップ)">
            <span>ベース</span>
          </button>
          <button data-inst="cosmic" data-color="#06b6d4"
            class="inst-btn px-2 py-0.5 rounded text-[11px] font-semibold border border-transparent transition flex items-center space-x-1"
            style="background-color: #06b6d4; color: white;" title="コズミック・シンセ (ディレイ＆エコー)">
            <span>宇宙リード</span>
          </button>
          <button data-inst="chiptune" data-color="#f97316"
            class="inst-btn px-2 py-0.5 rounded text-[11px] font-semibold border border-transparent transition flex items-center space-x-1"
            style="background-color: #f97316; color: white;" title="8bit 矩形波 (ファミコン風)">
            <span>8bit</span>
          </button>
        </div>

        <!-- ズーム操作コントロール (横ズーム 🔍↔️ & 縦ズーム 🔍↕️) -->
        <div class="flex items-center space-x-2 themed-surface px-2 py-1 rounded border themed-border">
          <!-- 横ズーム (時間軸拡大) -->
          <div class="flex items-center space-x-1">
            <span class="text-[10px] themed-text-muted" title="横方向（時間軸）の拡大率">🔍↔️ 横:</span>
            <button id="zoomXOutBtn" class="px-1 text-[11px] themed-text-muted hover:text-white" title="横縮小">-</button>
            <input id="zoomXSlider" type="range" min="50" max="300" value="100" class="flat-slider w-14" title="横拡大率" />
            <button id="zoomXInBtn" class="px-1 text-[11px] themed-text-muted hover:text-white" title="横拡大">+</button>
          </div>

          <!-- 縦ズーム (音高軸拡大) -->
          <div class="flex items-center space-x-1 border-l themed-border pl-2">
            <span class="text-[10px] themed-text-muted" title="縦方向（音高軸）の拡大率">🔍↕️ 縦:</span>
            <button id="zoomYOutBtn" class="px-1 text-[11px] themed-text-muted hover:text-white" title="縦縮小">-</button>
            <input id="zoomYSlider" type="range" min="60" max="250" value="100" class="flat-slider w-14" title="縦拡大率" />
            <button id="zoomYInBtn" class="px-1 text-[11px] themed-text-muted hover:text-white" title="縦拡大">+</button>
          </div>

          <!-- 全体フィットボタン -->
          <button id="zoomFitBtn"
            class="px-1.5 py-0.5 rounded text-[10px] border themed-border hover:bg-slate-500/20 transition"
            title="画面サイズに全体フィット">
            フィット
          </button>
        </div>

        <!-- スナップ設定（ティック＆音階） -->
        <div class="flex items-center space-x-2">
          <div class="flex items-center space-x-1">
            <span class="text-[10px] themed-text-muted">グリッド:</span>
            <select id="gridSnapSelect">
              <option value="free" selected>フリー (自由描画)</option>
              <option value="64">1/64 (微細)</option>
              <option value="32">1/32 (細部)</option>
              <option value="16">1/16 (標準)</option>
              <option value="8">1/8 (8分音符)</option>
            </select>
          </div>

          <div class="flex items-center space-x-1">
            <span class="text-[10px] themed-text-muted">音階吸着:</span>
            <select id="scaleSnapSelect">
              <option value="continuous" selected>アナログ無段階 (自由線)</option>
              <option value="semitone">半音階 (12平均律)</option>
              <option value="major">ドレミ (長調)</option>
              <option value="pentatonic">ペンタトニック</option>
            </select>
          </div>
        </div>

      </div>

      <!-- タイムライン・シークルーラー (クリックで途中から即座に再生可能！) -->
      <div class="relative w-full h-6 border themed-border rounded-t overflow-hidden select-none timeline-ruler"
        id="timelineRulerContainer" title="クリックして途中から再生（再生位置を自由にジャンプ）" style="background-color: var(--ruler-bg);">
        <canvas id="rulerCanvas" class="w-full h-full block"></canvas>
        <!-- シーク位置インジケーター -->
        <div id="rulerSeekMarker"
          class="absolute top-0 bottom-0 w-1 bg-amber-400 pointer-events-none opacity-90 shadow-sm" style="left: 0%;">
        </div>
      </div>

      <!-- スクロール可能なピアノロールキャンバス領域 -->
      <div id="canvasScrollWrapper" class="relative w-full border themed-border rounded-b overflow-auto"
        style="height: 380px; background-color: var(--canvas-bg);">
        <!-- 内部サイズがズーム倍率で拡張されるコンテナ -->
        <div id="canvasVirtualContainer" class="relative" style="width: 100%; height: 100%;">
          <canvas id="drawingCanvas" class="w-full h-full block cursor-crosshair"></canvas>

          <!-- 再生ヘッド縦バー (オーバーレイ) -->
          <div id="canvasPlayhead" class="absolute top-0 bottom-0 w-0.5 pointer-events-none opacity-90 z-20"
            style="left: 0%; background-color: var(--playhead-color);"></div>
        </div>

        <!-- マウスカーソル音程・時間情報表示（フロート） -->
        <div id="cursorInfo"
          class="absolute top-2 left-3 pointer-events-none themed-panel border themed-border rounded px-2 py-1 text-[10px] font-mono themed-text-muted flex items-center space-x-2 z-30 shadow">
          <span>音程: <strong id="cursorNoteText" class="text-white">--</strong></span>
          <span>周波数: <strong id="cursorFreqText" class="text-cyan-400">-- Hz</strong></span>
          <span>位置: <strong id="cursorTimeText" class="text-amber-400">--</strong></span>
        </div>
      </div>

      <!-- キャンバスフッター情報 -->
      <div class="flex flex-wrap items-center justify-between text-[11px] themed-text-muted pt-1 px-1">
        <div class="flex items-center space-x-3">
          <span>ストローク数: <strong id="strokeCountText" class="text-white">0</strong> 本</span>
          <span>途中再生: <strong class="text-cyan-400">タイムライン上をクリックでシーク</strong></span>
          <span>操作: <strong class="text-emerald-400">ホイールで縦スクロール / Shift+ホイールで横スクロール</strong></span>
        </div>
        <div class="flex items-center space-x-2">
          <span>メロディ音量:</span>
          <input id="synthCanvasVol" type="range" min="0" max="100" value="85" class="flat-slider w-20"
            title="描画シンセ音量" />
        </div>
      </div>

    </div>

    <!-- 3. ドラム・リズムマシン（16ステップ連動） -->
    <div class="themed-panel border rounded-lg p-2.5 overflow-x-auto shadow-sm">
      <div class="min-w-[760px]">

        <!-- ドラム見出し & 16ステップルーラー -->
        <div class="flex items-center mb-1.5">
          <div class="w-48 flex-shrink-0 pr-3 flex items-center justify-between">
            <div class="flex items-center space-x-1.5">
              <span class="w-2 h-2 rounded-full bg-orange-500"></span>
              <h2 class="font-bold text-xs tracking-wide">リズムマシン (ドラム連動)</h2>
            </div>
            <span class="text-[9px] themed-text-muted">全小節リピート</span>
          </div>

          <div id="drumStepRuler" class="flex-1 grid grid-cols-16 gap-1">
            <!-- JSで動的生成 -->
          </div>
        </div>

        <!-- ドラムトラック一覧 -->
        <div id="drumTracksContainer" class="space-y-1">
          <!-- JSで動的生成 -->
        </div>

      </div>
    </div>

  </div>

  <!-- アプリケーション JavaScript (ES Modules) -->
  <script type="module" src="js/app.js"></script>
</body>

</html>
